<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 225">
  <rect width="225" height="225" fill="#f47920"/>
  <g fill="#ffffff">
    <!-- Shield outline -->
    <path d="M60,45 L112.5,35 L165,45 L165,100 Q165,150 112.5,190 Q60,150 60,100 Z" fill="none" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Top left quadrant: Crossed keys -->
    <g transform="translate(85, 65)">
      <line x1="-15" y1="-10" x2="5" y2="10" stroke="#ffffff" stroke-width="3"/>
      <line x1="5" y1="-10" x2="-15" y2="10" stroke="#ffffff" stroke-width="3"/>
      <circle cx="-15" cy="-10" r="3" fill="#ffffff"/>
      <circle cx="5" cy="-10" r="3" fill="#ffffff"/>
    </g>
    
    <!-- Top right quadrant: Books -->
    <g transform="translate(135, 60)">
      <rect x="-15" y="0" width="8" height="25" fill="#ffffff"/>
      <rect x="-5" y="0" width="8" height="25" fill="#ffffff"/>
      <rect x="5" y="0" width="8" height="25" fill="#ffffff"/>
      <line x1="-15" y1="5" x2="-7" y2="5" stroke="#f47920" stroke-width="1"/>
      <line x1="-15" y1="10" x2="-7" y2="10" stroke="#f47920" stroke-width="1"/>
      <line x1="-5" y1="5" x2="3" y2="5" stroke="#f47920" stroke-width="1"/>
      <line x1="-5" y1="10" x2="3" y2="10" stroke="#f47920" stroke-width="1"/>
      <line x1="5" y1="5" x2="13" y2="5" stroke="#f47920" stroke-width="1"/>
      <line x1="5" y1="10" x2="13" y2="10" stroke="#f47920" stroke-width="1"/>
    </g>
    
    <!-- Bottom left quadrant: Lion -->
    <g transform="translate(85, 125)">
      <ellipse cx="0" cy="0" rx="15" ry="12" fill="#ffffff"/>
      <circle cx="-5" cy="-3" r="2" fill="#f47920"/>
      <circle cx="5" cy="-3" r="2" fill="#f47920"/>
      <path d="M -5,5 Q 0,8 5,5" fill="none" stroke="#f47920" stroke-width="1.5"/>
      <polygon points="-15,-8 -10,-12 -5,-8" fill="#ffffff"/>
      <polygon points="15,-8 10,-12 5,-8" fill="#ffffff"/>
    </g>
    
    <!-- Bottom right quadrant: Stars -->
    <g transform="translate(135, 125)">
      <polygon points="0,-8 2,-3 7,-3 3,0 5,5 0,2 -5,5 -3,0 -7,-3 -2,-3" fill="#ffffff"/>
      <polygon points="-12,5 -11,8 -9,8 -10,10 -9,12 -12,11 -15,12 -14,10 -15,8 -13,8" fill="#ffffff"/>
      <polygon points="12,5 13,8 15,8 14,10 15,12 12,11 9,12 10,10 9,8 11,8" fill="#ffffff"/>
      <circle cx="-5" cy="-5" r="1.5" fill="#ffffff"/>
      <circle cx="8" cy="-3" r="1.5" fill="#ffffff"/>
    </g>
    
    <!-- Vertical and horizontal dividing lines -->
    <line x1="112.5" y1="45" x2="112.5" y2="100" stroke="#ffffff" stroke-width="3"/>
    <line x1="60" y1="95" x2="165" y2="95" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>